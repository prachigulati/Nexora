<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Projects - Nexora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .communication-header {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .header-title h1 {
            color: #2d3748;
            font-size: 1.8rem;
            font-weight: 600;
            margin: 0;
        }

        .header-stats {
            display: flex;
            gap: 20px;
            align-items: center;
            font-size: 0.9rem;
            color: #6b7280;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-tabs {
            background: white;
            border-radius: 12px;
            padding: 8px;
            margin-bottom: 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
            border: none;
        }

        .nav-tabs .nav-link {
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            color: #6b7280;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-tabs .nav-link.active {
            background: #7c3aed;
            color: white;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
        }

        .nav-tabs .nav-link:hover:not(.active) {
            background: #f8fafc;
            color: #4a5568;
        }

        .projects-container {
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .empty-state {
            padding: 60px 20px;
        }

        .empty-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 24px;
            background: #f8fafc;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            font-size: 3rem;
        }

        .empty-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 12px;
        }

        .empty-description {
            color: #6b7280;
            font-size: 1rem;
            margin-bottom: 32px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .create-project-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .create-project-btn:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.3);
            color: white;
        }

        .nav-home-btn {
            padding: 8px 12px;
            border: 1px solid #e9ecef;
            background: white;
            border-radius: 8px;
            color: #6c757d;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-right: 12px;
        }

        .nav-home-btn:hover {
            background: #7c3aed;
            color: white;
            border-color: #7c3aed;
            transform: translateY(-1px);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .action-btn {
            padding: 8px 16px;
            border: 1px solid #e9ecef;
            background: white;
            border-radius: 8px;
            color: #6c757d;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-btn:hover {
            background: #f8fafc;
            color: #4a5568;
            border-color: #d1d5db;
        }

        .action-btn.primary {
            background: #7c3aed;
            color: white;
            border-color: #7c3aed;
        }

        .action-btn.primary:hover {
            background: #6d28d9;
            color: white;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Header -->
        <div class="communication-header">
            <div class="header-title">
                <i class="bi bi-chat-dots" style="color: #7c3aed; font-size: 1.5rem;"></i>
                <h1>Communication Hub</h1>
                <div class="header-actions ms-auto">
                    <a href="{% url 'home' %}" class="nav-home-btn">
                        <i class="bi bi-house"></i>
                        Home
                    </a>
                    <a href="/messaging/" class="action-btn">
                        <i class="bi bi-chat"></i>
                        Messages
                    </a>
                    <a href="/notifications/" class="action-btn">
                        <i class="bi bi-bell"></i>
                        Notifications
                    </a>
                </div>
            </div>
            <div class="header-stats">
                <div class="stat-item">
                    <div class="status-dot" style="width: 8px; height: 8px; background: #10b981; border-radius: 50%;"></div>
                    <span>1 unread</span>
                </div>
                <div class="stat-item">
                    <i class="bi bi-people"></i>
                    <span>1 active</span>
                </div>
                <div class="stat-item">
                    <i class="bi bi-clock"></i>
                    <span>Last sync: now</span>
                </div>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <ul class="nav nav-tabs" id="communicationTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="messages-tab" data-bs-toggle="tab" data-bs-target="#messages" type="button" role="tab">
                    <i class="bi bi-chat-dots me-2"></i>
                    All Messages
                    <span class="badge bg-danger ms-2">1</span>
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="notifications-tab" data-bs-toggle="tab" data-bs-target="#notifications" type="button" role="tab">
                    <i class="bi bi-bell me-2"></i>
                    Notifications
                    <span class="badge bg-warning ms-2">1</span>
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="applications-tab" data-bs-toggle="tab" data-bs-target="#applications" type="button" role="tab">
                    <i class="bi bi-file-earmark-person me-2"></i>
                    Applications
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="projects-tab" data-bs-toggle="tab" data-bs-target="#projects" type="button" role="tab">
                    <i class="bi bi-folder me-2"></i>
                    Browse Projects
                </button>
            </li>
        </ul>

        <!-- Tab Content -->
        <div class="tab-content" id="communicationTabsContent">
            <div class="tab-pane fade show active" id="projects" role="tabpanel">
                <div class="projects-container">
                    <div class="empty-state">
                        <div class="empty-icon">
                            <i class="bi bi-folder-x"></i>
                        </div>
                        <h3 class="empty-title">No projects published</h3>
                        <p class="empty-description">
                            Create your first project to start receiving applications
                        </p>
                        <a href="/create-project/" class="create-project-btn">
                            <i class="bi bi-plus-circle"></i>
                            Create Project
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
