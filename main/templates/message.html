<!-- Direct Chat Modal -->
<div class="modal fade" id="directChatModal" tabindex="-1" aria-labelledby="directChatModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="directChatModalLabel">
          <i class="bi bi-chat-dots me-2"></i>
          Chat with <span id="founderName"></span>
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-0">
        <!-- Project Info Header -->
        <div class="bg-light p-3 border-bottom">
          <div class="d-flex align-items-center">
            <div class="me-3">
              <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" 
                   style="width: 40px; height: 40px;">
                <i class="bi bi-briefcase"></i>
              </div>
            </div>
            <div>
              <h6 class="mb-0" id="projectName"></h6>
              <small class="text-muted" id="projectInfo"></small>
            </div>
          </div>
        </div>
        
        <!-- Messages Area -->
        <div class="chat-messages" id="chatMessages" style="height: 400px; overflow-y: auto; padding: 20px;">
          <div class="text-center text-muted" id="emptyState">
            <i class="bi bi-chat-square-text display-4 mb-3"></i>
            <h6>Start a conversation</h6>
            <p>Send a message to connect with the project founder</p>
          </div>
        </div>
        
        <!-- Message Input -->
        <div class="border-top p-3">
          <div class="input-group">
            <textarea 
              class="form-control" 
              id="messageInput" 
              placeholder="Type your message..." 
              rows="2"
              style="resize: none;"
            ></textarea>
            <button class="btn btn-primary" type="button" id="sendMessageBtn">
              <i class="bi bi-send"></i>
            </button>
          </div>
          <small class="text-muted mt-1 d-block">Press Ctrl+Enter to send</small>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
.chat-messages {
  background-color: #f8f9fa;
}

.message {
  margin-bottom: 15px;
  max-width: 80%;
}

.message.sent {
  margin-left: auto;
}

.message.received {
  margin-right: auto;
}

.message-bubble {
  padding: 10px 15px;
  border-radius: 18px;
  word-wrap: break-word;
}

.message.sent .message-bubble {
  background-color: #007bff;
  color: white;
  border-bottom-right-radius: 5px;
}

.message.received .message-bubble {
  background-color: white;
  color: #333;
  border: 1px solid #e9ecef;
  border-bottom-left-radius: 5px;
}

.message-time {
  font-size: 0.75rem;
  color: #6c757d;
  margin-top: 5px;
}

.message.sent .message-time {
  text-align: right;
}

.message.received .message-time {
  text-align: left;
}

.typing-indicator {
  display: none;
  padding: 10px 15px;
  background-color: white;
  border: 1px solid #e9ecef;
  border-radius: 18px;
  border-bottom-left-radius: 5px;
  max-width: 80px;
  margin-bottom: 15px;
}

.typing-dots {
  display: flex;
  align-items: center;
  gap: 3px;
}

.typing-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background-color: #6c757d;
  animation: typing 1.4s infinite ease-in-out;
}

.typing-dot:nth-child(1) { animation-delay: -0.32s; }
.typing-dot:nth-child(2) { animation-delay: -0.16s; }

@keyframes typing {
  0%, 80%, 100% {
    transform: scale(0.8);
    opacity: 0.5;
  }
  40% {
    transform: scale(1);
    opacity: 1;
  }
}

#messageInput:focus {
  border-color: #007bff;
  box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
}

.modal-header {
  border-bottom: none;
}

.modal-body {
  border-radius: 0 0 0.375rem 0.375rem;
}
</style>

<script>
let currentProjectId = null;
let currentFounderName = null;
let messagePollingInterval = null;

function openDirectChat(projectId, founderName, projectName, isFounder = false) {
  currentProjectId = projectId;
  currentFounderName = founderName;

  // Update modal content based on perspective
  if (isFounder) {
    document.getElementById('founderName').textContent = 'Investor Messages';
    document.getElementById('projectInfo').textContent = `Messages about ${projectName}`;
  } else {
    document.getElementById('founderName').textContent = founderName;
    document.getElementById('projectInfo').textContent = `Project by ${founderName}`;
  }

  document.getElementById('projectName').textContent = projectName;

  // Clear previous messages
  document.getElementById('chatMessages').innerHTML = `
    <div class="text-center text-muted" id="emptyState">
      <i class="bi bi-chat-square-text display-4 mb-3"></i>
      <h6>Start a conversation</h6>
      <p>${isFounder ? 'Messages from interested investors will appear here' : 'Send a message to connect with the project founder'}</p>
    </div>
  `;

  // Load existing messages
  loadDirectMessages(projectId);

  // Show modal
  const modal = new bootstrap.Modal(document.getElementById('directChatModal'));
  modal.show();

  // Start polling for new messages
  startMessagePolling();

  // Focus on input when modal is shown
  document.getElementById('directChatModal').addEventListener('shown.bs.modal', function () {
    document.getElementById('messageInput').focus();
  });

  // Stop polling when modal is hidden
  document.getElementById('directChatModal').addEventListener('hidden.bs.modal', function () {
    stopMessagePolling();
  });
}

function loadDirectMessages(projectId) {
  fetch(`/direct-messages/${projectId}/`)
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        displayMessages(data.messages);
      } else if (data.error === 'No conversation found') {
        // This is fine, just means no messages yet
        console.log('No existing conversation');
      } else {
        console.error('Error loading messages:', data.error);
      }
    })
    .catch(error => {
      console.error('Error:', error);
    });
}

function displayMessages(messages) {
  const chatMessages = document.getElementById('chatMessages');
  
  if (messages.length === 0) {
    return; // Keep empty state
  }
  
  // Hide empty state
  const emptyState = document.getElementById('emptyState');
  if (emptyState) {
    emptyState.style.display = 'none';
  }
  
  chatMessages.innerHTML = '';
  
  messages.forEach(message => {
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${message.is_sender ? 'sent' : 'received'}`;
    
    messageDiv.innerHTML = `
      <div class="message-bubble">
        ${message.content}
      </div>
      <div class="message-time">
        ${message.timestamp}
      </div>
    `;
    
    chatMessages.appendChild(messageDiv);
  });
  
  // Scroll to bottom
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function sendDirectMessage() {
  const messageInput = document.getElementById('messageInput');
  const content = messageInput.value.trim();
  
  if (!content || !currentProjectId) {
    return;
  }
  
  // Disable send button
  const sendBtn = document.getElementById('sendMessageBtn');
  sendBtn.disabled = true;
  
  fetch('/send-direct-message/', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': getCookie('csrftoken')
    },
    body: JSON.stringify({
      project_id: currentProjectId,
      content: content
    })
  })
  .then(response => response.json())
  .then(data => {
    if (data.success) {
      // Clear input
      messageInput.value = '';
      
      // Add message to chat
      addMessageToChat(data.message, true);
      
      // Hide empty state if visible
      const emptyState = document.getElementById('emptyState');
      if (emptyState) {
        emptyState.style.display = 'none';
      }
    } else {
      alert('Error sending message: ' + data.error);
    }
  })
  .catch(error => {
    console.error('Error:', error);
    alert('Error sending message');
  })
  .finally(() => {
    sendBtn.disabled = false;
  });
}

function addMessageToChat(message, isSent) {
  const chatMessages = document.getElementById('chatMessages');
  
  const messageDiv = document.createElement('div');
  messageDiv.className = `message ${isSent ? 'sent' : 'received'}`;
  
  messageDiv.innerHTML = `
    <div class="message-bubble">
      ${message.content}
    </div>
    <div class="message-time">
      ${message.timestamp}
    </div>
  `;
  
  chatMessages.appendChild(messageDiv);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function startMessagePolling() {
  if (messagePollingInterval) {
    clearInterval(messagePollingInterval);
  }
  
  messagePollingInterval = setInterval(() => {
    if (currentProjectId) {
      loadDirectMessages(currentProjectId);
    }
  }, 30000); // Poll every 30 seconds to reduce server load
}

function stopMessagePolling() {
  if (messagePollingInterval) {
    clearInterval(messagePollingInterval);
    messagePollingInterval = null;
  }
}

// Event listeners
document.getElementById('sendMessageBtn').addEventListener('click', sendDirectMessage);

document.getElementById('messageInput').addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.key === 'Enter') {
    e.preventDefault();
    sendDirectMessage();
  }
});

// Helper function to get CSRF token
function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let i = 0; i < cookies.length; i++) {
      const cookie = cookies[i].trim();
      if (cookie.substring(0, name.length + 1) === (name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}
</script>
