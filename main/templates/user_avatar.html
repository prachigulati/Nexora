{% if avatar and file_exists %}
<img
  src="{{ avatar.url }}"
  alt="{{ alt_text }}"
  class="{{ css_class }}"
  style="width: {{ size }}px; height: {{ size }}px; object-fit: cover;"
  onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'d-flex align-items-center justify-content-center bg-primary text-white {{ css_class }}\' style=\'width: {{ size }}px; height: {{ size }}px; font-size: {% widthratio size 2 1 %}px; font-weight: bold;\'>{{ fallback_text }}</div>';"
/>
{% else %}
<div
  class="d-flex align-items-center justify-content-center bg-primary text-white {{ css_class }}"
  style="width: {{ size }}px; height: {{ size }}px; font-size: {% widthratio size 2 1 %}px; font-weight: bold;"
>
  {{ fallback_text }}
</div>
{% endif %}
