<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Messages - Nexora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        :root {
            --primary: #7c3aed;
            --primary-light: #a855f7;
            --background-light: #f8fafc;
            --background-gray: #f1f5f9;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        body {
            background: var(--background-gray);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* Unified Messaging Layout */
        .messaging-container {
            height: calc(100vh - 76px);
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            padding: 0;
            margin: 0;
        }

        /* Hide Sidebar */
        .messaging-sidebar {
            display: none;
        }

        /* Main Chat Area */
        .chat-main {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: white;
        }

        /* Full Width Messaging Interface */
        .full-width-messaging {
            width: 100%;
            height: calc(100vh - 76px);
            display: flex;
            flex-direction: column;
            background: white;
        }

        /* Filter and Search Bar */
        .messaging-filters {
            padding: 20px;
            border-bottom: 1px solid var(--border-light);
            background: white;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .filter-select {
            padding: 8px 12px;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            background: white;
            font-size: 14px;
            min-width: 120px;
        }

        .search-input-full {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            font-size: 14px;
            min-width: 250px;
        }

        .search-input-full:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.1);
        }

        /* Messages List */
        .messages-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message-item {
            background: white;
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .message-item:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.1);
        }

        .message-item.unread {
            background: rgba(124, 58, 237, 0.02);
            border-color: var(--primary);
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .message-user {
            font-weight: 600;
            color: var(--text-dark);
        }

        .message-project {
            font-size: 12px;
            color: var(--text-muted);
            margin-left: 8px;
        }

        .message-tags {
            display: flex;
            gap: 6px;
        }

        .message-tag {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: 500;
            text-transform: uppercase;
        }

        .tag-direct {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
        }

        .tag-applicant {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }

        .tag-application {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
        }

        .tag-approved {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }

        .tag-rejected {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .tag-pending {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
        }

        .message-preview {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 8px;
        }

        .message-time {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }


    </style>
</head>
<body>
    {% include 'messaging_navigation.html' %}

    <div class="container-fluid px-4 py-3">
        <div class="messaging-container">
            <!-- Full Width Messaging Interface -->
            <div class="full-width-messaging">
                <!-- Filter and Search Bar -->
                <div class="messaging-filters">
                    <div class="filter-group">
                        <label for="tagFilter">Filter by:</label>
                        <select id="tagFilter" class="filter-select" onchange="filterMessages()">
                            <option value="all">All Messages</option>
                            <option value="direct">Direct</option>
                            <option value="applicant">Applicant</option>
                            <option value="application">Application</option>
                        </select>
                    </div>
                    <input type="text" id="messageSearch" class="search-input-full" placeholder="Search by username or project name..." oninput="searchMessages()">
                </div>

                <!-- Messages List -->
                <div class="messages-list-container" id="messagesContainer">
                    <!-- Messages will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Include Unified Chat Component -->
    {% include 'unified_chat.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Global variables
        let conversations = [];
        let currentConversation = null;
        let messagePollingInterval = null;

        // Initialize messaging system
        document.addEventListener('DOMContentLoaded', function() {
            loadConversations();
        });

        // Load all conversations
        async function loadConversations() {
            try {
                const response = await fetch('/api/conversations/', {
                    headers: {
                        'X-CSRFToken': getCookie('csrftoken')
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    conversations = data.conversations;
                    console.log('Loaded conversations:', conversations);
                    renderMessagesFullWidth();
                } else {
                    console.error('Failed to load conversations');
                }
            } catch (error) {
                console.error('Error loading conversations:', error);
            }
        }

        // Render messages in full-width interface
        function renderMessagesFullWidth() {
            const container = document.getElementById('messagesContainer');

            if (conversations.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-chat-heart"></i>
                        <h4>Welcome to Nexora Messaging</h4>
                        <p>Start messaging with founders, investors, and applicants.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = conversations.map(conversation => {
                const messageType = conversation.type || 'direct';
                const tagClass = `tag-${messageType}`;
                const tagText = messageType.charAt(0).toUpperCase() + messageType.slice(1);

                // Determine project display text based on message type and role
                let projectDisplay = '';
                const projectName = conversation.project || conversation.project_name;

                if (projectName) {
                    switch (messageType) {
                        case 'direct':
                            if (conversation.role === 'Investor') {
                                projectDisplay = `on your project: ${projectName}`;
                            } else if (conversation.role === 'Project Owner') {
                                projectDisplay = `you messaged about: ${projectName}`;
                            } else {
                                projectDisplay = `about project: ${projectName}`;
                            }
                            break;
                        case 'applicant':
                            projectDisplay = `applied to your project: ${projectName}`;
                            break;
                        case 'application':
                            projectDisplay = `you applied to: ${projectName}`;
                            break;
                        default:
                            projectDisplay = projectName;
                    }
                }

                // Check if conversation is clickable (only approved applications can be clicked)
                const isClickable = messageType === 'direct' || (conversation.status && conversation.status === 'approved');
                const clickHandler = isClickable ? `onclick="openUnifiedChat('${conversation.id}', '${conversation.name}', '${projectDisplay}', '${messageType}', '${conversation.avatar || ''}')"` : '';
                const cursorStyle = isClickable ? 'cursor: pointer;' : 'cursor: default; opacity: 0.7;';

                // Create status tags
                let statusTags = `<span class="message-tag ${tagClass}">${tagText}</span>`;
                if (conversation.status) {
                    const statusClass = conversation.status === 'approved' ? 'tag-approved' :
                                      conversation.status === 'rejected' ? 'tag-rejected' : 'tag-pending';
                    const statusText = conversation.status === 'approved' ? 'APPROVED' :
                                     conversation.status === 'rejected' ? 'REJECTED' : 'PENDING APPROVAL';
                    statusTags += `<span class="message-tag ${statusClass}">${statusText}</span>`;
                }

                return `
                    <div class="message-item ${conversation.unread ? 'unread' : ''}" ${clickHandler} style="${cursorStyle}">
                        <div class="message-header">
                            <div>
                                <span class="message-user">${conversation.name}</span>
                                ${projectDisplay ? `<span class="message-project">${projectDisplay}</span>` : ''}
                            </div>
                            <div class="message-tags">
                                ${statusTags}
                            </div>
                        </div>
                        <div class="message-preview">${conversation.lastMessage || conversation.last_message || (isClickable ? 'No messages yet' : 'Messaging disabled - pending approval')}</div>
                        <div class="message-time">${conversation.lastMessageTime || conversation.last_message_time || ''}</div>
                    </div>
                `;
            }).join('');
        }

        // Filter messages
        function filterMessages() {
            const filterValue = document.getElementById('tagFilter').value;
            const searchValue = document.getElementById('messageSearch').value.toLowerCase();

            let filtered = conversations;

            if (filterValue !== 'all') {
                filtered = filtered.filter(conv => conv.type === filterValue);
            }

            if (searchValue) {
                filtered = filtered.filter(conv =>
                    conv.name.toLowerCase().includes(searchValue) ||
                    (conv.project && conv.project.toLowerCase().includes(searchValue)) ||
                    (conv.project_name && conv.project_name.toLowerCase().includes(searchValue))
                );
            }

            renderFilteredMessages(filtered);
        }

        // Search messages
        function searchMessages() {
            filterMessages();
        }

        // Render filtered messages
        function renderFilteredMessages(filteredConversations) {
            const container = document.getElementById('messagesContainer');

            if (filteredConversations.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-search"></i>
                        <h5>No messages found</h5>
                        <p>Try adjusting your search or filter criteria.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredConversations.map(conversation => {
                const messageType = conversation.type || 'direct';
                const tagClass = `tag-${messageType}`;
                const tagText = messageType.charAt(0).toUpperCase() + messageType.slice(1);

                // Determine project display text based on message type and role
                let projectDisplay = '';
                const projectName = conversation.project || conversation.project_name;
                if (projectName) {
                    switch (messageType) {
                        case 'direct':
                            if (conversation.role === 'Investor') {
                                projectDisplay = `on your project: ${projectName}`;
                            } else if (conversation.role === 'Project Owner') {
                                projectDisplay = `you messaged about: ${projectName}`;
                            } else {
                                projectDisplay = `about project: ${projectName}`;
                            }
                            break;
                        case 'applicant':
                            projectDisplay = `applied to your project: ${projectName}`;
                            break;
                        case 'application':
                            projectDisplay = `you applied to: ${projectName}`;
                            break;
                        default:
                            projectDisplay = projectName;
                    }
                }

                // Check if conversation is clickable (only approved applications can be clicked)
                const isClickable = messageType === 'direct' || (conversation.status && conversation.status === 'approved');
                const clickHandler = isClickable ? `onclick="openUnifiedChat('${conversation.id}', '${conversation.name}', '${projectDisplay}', '${messageType}', '${conversation.avatar || ''}')"` : '';
                const cursorStyle = isClickable ? 'cursor: pointer;' : 'cursor: default; opacity: 0.7;';

                // Create status tags
                let statusTags = `<span class="message-tag ${tagClass}">${tagText}</span>`;
                if (conversation.status) {
                    const statusClass = conversation.status === 'approved' ? 'tag-approved' :
                                      conversation.status === 'rejected' ? 'tag-rejected' : 'tag-pending';
                    const statusText = conversation.status === 'approved' ? 'APPROVED' :
                                     conversation.status === 'rejected' ? 'REJECTED' : 'PENDING APPROVAL';
                    statusTags += `<span class="message-tag ${statusClass}">${statusText}</span>`;
                }

                return `
                    <div class="message-item ${conversation.unread ? 'unread' : ''}" ${clickHandler} style="${cursorStyle}">
                        <div class="message-header">
                            <div>
                                <span class="message-user">${conversation.name}</span>
                                ${projectDisplay ? `<span class="message-project">${projectDisplay}</span>` : ''}
                            </div>
                            <div class="message-tags">
                                ${statusTags}
                            </div>
                        </div>
                        <div class="message-preview">${conversation.lastMessage || conversation.last_message || (isClickable ? 'No messages yet' : 'Messaging disabled - pending approval')}</div>
                        <div class="message-time">${conversation.lastMessageTime || conversation.last_message_time || ''}</div>
                    </div>
                `;
            }).join('');
        }


    </script>
</body>
</html>
