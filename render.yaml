services:
  - type: web
    name: nexora
    env: python
    plan: free
        buildCommand: "pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py force_migrate && python manage.py add_projects --input-file nexora_data_export.json && python manage.py generate_ai_analysis --force && python manage.py collectstatic --noinput"
    startCommand: "gunicorn app.wsgi:application --bind 0.0.0.0:$PORT --timeout 120 --workers 2 --worker-class sync --max-requests 1000 --max-requests-jitter 100 --preload"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: app.settings
      - key: DEBUG
        value: "False"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: PORT
        value: "10000"
